name: test

# Two jobs (split 2026-09-26):
#   test     build + unit tests (PhaseTrainingTests), two shards in
#            parallel (2026-11-24). Every push to main or an agent
#            branch, every PR, manual runs. This is the only compiler agent
#            sessions have, so it runs on every code push.
#   ui-tests the XCUITest suite plus the tap-budget report, three shards
#            in parallel (rebalanced 2026-11-24). PRs, pushes to main, nightly,
#            and manual runs with ui=true. About 30 minutes per shard, which
#            is why it does not gate every push.
# Docs-only pushes skip both (paths-ignore). A newer push to the same ref
# cancels the older run.

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['**.md', 'docs/**', 'audits/**', 'handoff/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'audits/**', 'handoff/**']
  schedule:
    # Nightly UI pass at 09:17 UTC (about 3am Mountain), so a UI regression
    # that slipped past branch pushes surfaces within a day.
    - cron: '17 9 * * *'
  # Manual runs so a feature branch can be validated without opening a PR
  # (e.g. agent sessions that can't build locally). ui=true adds the UI suite.
  workflow_dispatch:
    inputs:
      ui:
        description: Also run the UI test suite
        type: boolean
        default: false

# The nightly run gets its own group. In a shared group a late cron start
# cancelled the push run on main mid-UI-suite (run 44583334374, 2026-11-19).
concurrency:
  group: test-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'push' }}
  cancel-in-progress: true

jobs:
  test:
    # macos-26 ships Xcode 17 with iOS 26 SDK, matching the dev environment.
    # macos-15 / Xcode 16 / iOS 18 caused divergent SwiftUI accessibility
    # behavior in UI tests — rest-card preset Menu items rendered differently
    # between iOS 18 and iOS 26, making LogFlowTests unfixable on both.
    runs-on: macos-26
    # The nightly schedule is for the UI suite only.
    if: github.event_name != 'schedule'
    # Three shards, each with its own build (about 6.5 minutes on CI). The
    # generator grid suites outgrew one 25-minute job: in run 44563801469
    # (4a67c73) FilterCompositionTests took 497 s, GeneratorWeekInvariantTests
    # 190 s and SeasonInvariantTests 109 s, and the job was cancelled at
    # 25 minutes with SportProfileTests and the suites after it unrun.
    # A grid suite added later goes in a grid shard and in core's skip list.
    # 2026-11-24: GitHub runs at most 5 macOS jobs at once for this repo
    # (run 45425353460 started 5 of 7 jobs at +0 and the other two at +14
    # and +16 minutes). filter-grid (16 min) folded back into core (14 min),
    # about 22 minutes together, so the 2 unit plus 3 UI jobs all start at
    # once. Keep the total at 5 jobs.
    name: test (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            tests: >-
              -only-testing:PhaseTrainingTests
              -skip-testing:PhaseTrainingTests/GeneratorWeekInvariantTests
              -skip-testing:PhaseTrainingTests/SeasonInvariantTests
              -skip-testing:PhaseTrainingTests/SportProfileTests
              -skip-testing:PhaseTrainingTests/GeneratorCompositionTests
          - shard: season-grids
            tests: >-
              -only-testing:PhaseTrainingTests/GeneratorWeekInvariantTests
              -only-testing:PhaseTrainingTests/SeasonInvariantTests
              -only-testing:PhaseTrainingTests/SportProfileTests
              -only-testing:PhaseTrainingTests/GeneratorCompositionTests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        id: setup
        uses: ./.github/actions/ios-setup

      - name: Build and run unit tests
        # No retries here: the retry flags exist for the XCUITest cold-boot
        # tap flake, and a unit test that needs a retry is a real bug.
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project PhaseTraining.xcodeproj \
            -scheme PhaseTraining \
            -destination "platform=iOS Simulator,id=${{ steps.setup.outputs.udid }}" \
            ${{ matrix.tests }} \
            -resultBundlePath build/UnitTestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/raw-unit-test.log \
            | xcbeautify --renderer github-actions

      - name: Upload xcresult on failure
        # cancelled() covers the timeout-minutes cancel. xcbeautify prints
        # nothing until the run ends, so the raw log's "Test Case ...
        # started" lines are the only record of which suite stalled (11e 1.13).
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: UnitTestResults-${{ matrix.shard }}.xcresult
          path: |
            build/UnitTestResults.xcresult
            build/raw-unit-test.log

  ui-tests:
    runs-on: macos-26
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.ui)
    # Three shards (split 2026-11-19), each with its own build (about 10
    # minutes of setup on CI). One job outgrew 60 minutes: run 44586959390
    # spent 51 minutes in tests, started 41 of 47 suites and was cancelled
    # inside TapBudgetTests. Per-suite seconds from runs 44544230552 and
    # 44586959390 (larger of the two): TapBudgetTests 616+, LogFlowTests 340,
    # ProgressScreenUITests 264, CustomExerciseUITests 259, PaywallHeroUITests
    # 192, Phase2ReachUITests 186, ArcDeloadNoticeUITests 141,
    # MotivationBatchUITests 120, every other suite under 80. That gives about
    # 18 minutes of tests per shard. `flows` runs every suite not named in
    # the other shards, so a new UI suite lands there; a slow one moves to a
    # named shard and into flows' skip list.
    # 2026-11-24: rebalanced to three shards of about 23 to 24 minutes of
    # tests each, using the larger per-suite time of runs 45209085302 and
    # 45425353460 (suite times vary up to 5x between runs from per-case
    # retries). Setup and build add about 8 minutes per job. taps must keep
    # TapBudgetTests: the tap-budget steps run only on that shard.
    name: ui-tests (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: taps
            tests: >-
              -only-testing:PhaseTrainingUITests/TapBudgetTests
              -only-testing:PhaseTrainingUITests/ProgressScreenUITests
              -only-testing:PhaseTrainingUITests/FreestyleWorkoutUITests
              -only-testing:PhaseTrainingUITests/ConsolidateFlowTests
              -only-testing:PhaseTrainingUITests/MotivationBatchUITests
              -only-testing:PhaseTrainingUITests/Phase2ReachUITests
              -only-testing:PhaseTrainingUITests/StoreScreenshotUITests
          - shard: screens
            tests: >-
              -only-testing:PhaseTrainingUITests/LogFlowTests
              -only-testing:PhaseTrainingUITests/ArcDeloadNoticeUITests
              -only-testing:PhaseTrainingUITests/CustomExerciseUITests
              -only-testing:PhaseTrainingUITests/BuildAndStartWorkoutUITests
              -only-testing:PhaseTrainingUITests/ExerciseStrengthCardUITests
              -only-testing:PhaseTrainingUITests/HistoryMoodUITests
          - shard: flows
            tests: >-
              -only-testing:PhaseTrainingUITests
              -skip-testing:PhaseTrainingUITests/TapBudgetTests
              -skip-testing:PhaseTrainingUITests/ProgressScreenUITests
              -skip-testing:PhaseTrainingUITests/FreestyleWorkoutUITests
              -skip-testing:PhaseTrainingUITests/ConsolidateFlowTests
              -skip-testing:PhaseTrainingUITests/MotivationBatchUITests
              -skip-testing:PhaseTrainingUITests/Phase2ReachUITests
              -skip-testing:PhaseTrainingUITests/StoreScreenshotUITests
              -skip-testing:PhaseTrainingUITests/LogFlowTests
              -skip-testing:PhaseTrainingUITests/ArcDeloadNoticeUITests
              -skip-testing:PhaseTrainingUITests/CustomExerciseUITests
              -skip-testing:PhaseTrainingUITests/BuildAndStartWorkoutUITests
              -skip-testing:PhaseTrainingUITests/ExerciseStrengthCardUITests
              -skip-testing:PhaseTrainingUITests/HistoryMoodUITests
    # 45: each shard should finish in about 32 minutes (8 setup, 24 tests),
    # with room for the per-case retries below.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        id: setup
        uses: ./.github/actions/ios-setup

      - name: Crash-retry script tests
        # Unit tests for the runner-crash parser the next step calls.
        run: python3 scripts/quality/test_ui_crash_retry.py

      - name: Run UI tests
        # -retry-tests-on-failure + -test-iterations 3: retry only the
        # individual failing test cases (not the whole suite), up to 2
        # retries each. Absorbs the macos-26 cold-boot XCUITest rig flake
        # we've been chasing — synthesized taps occasionally fail to
        # register on a freshly-booted simulator, hitting a different test
        # each run. A real regression still fails (it'd fail all 3 tries);
        # a single-shot rig flake gets absorbed transparently. Apple-
        # supported since Xcode 13.
        #
        # Per-case timeouts: a case past 180 s fails by name and is retried,
        # so one hung case costs about 9 minutes instead of the job. Run
        # 45580604970 (c58ab85) had one flows case stall 915 s with no
        # output and the shard was cancelled at 45 min. Slowest normal case
        # is CustomExerciseUITests at 236 s, which sets its own 420 s
        # allowance; every other case ran under 98 s in runs 45574504764
        # and four before it. XCTest rounds allowances up to the minute.
        #
        # Those retries need a live runner. When the runner itself dies
        # ("Test crashed with signal term."), the relaunched runner logs
        # "Executed 0 tests" and the case is never retried (run 44805314849).
        # If every failed case is such a crash, ui_crash_retry.py prints
        # their -only-testing args and they re-run once; the shard takes
        # the re-run's result. Any other failure keeps the first result.
        run: |
          set -o pipefail
          mkdir -p build
          status=0
          xcodebuild test \
            -project PhaseTraining.xcodeproj \
            -scheme PhaseTraining \
            -destination "platform=iOS Simulator,id=${{ steps.setup.outputs.udid }}" \
            ${{ matrix.tests }} \
            -resultBundlePath build/TestResults.xcresult \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 600 \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/raw-test.log \
            | xcbeautify --renderer github-actions \
            || status=$?
          [ "$status" -eq 0 ] && exit 0
          if ! retry=$(python3 scripts/quality/ui_crash_retry.py build/TestResults.xcresult); then
            exit "$status"
          fi
          echo "::warning::Test runner crashed; re-running once: ${retry//$'\n'/ }"
          # One arg per line, no spaces or globs, so word splitting is wanted.
          # shellcheck disable=SC2086
          xcodebuild test \
            -project PhaseTraining.xcodeproj \
            -scheme PhaseTraining \
            -destination "platform=iOS Simulator,id=${{ steps.setup.outputs.udid }}" \
            $retry \
            -resultBundlePath build/RetryResults.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 600 \
            CODE_SIGNING_ALLOWED=NO \
            | tee -a build/raw-test.log \
            | xcbeautify --renderer github-actions

      # The three tap-budget steps read TapBudgetTests' markers, so they
      # run only on the shard that runs that suite.
      - name: Tap budget diff tests
        if: matrix.shard == 'taps'
        # The diff script's own unit tests (gating contract, retry semantics,
        # baseline parsing). Cheap; run before the drift step so a broken
        # script can't mislead the report.
        run: python3 scripts/quality/test_tap_budget_diff.py

      - name: Tap budget drift
        # Parses the TAP-BUDGET-JSON markers from the test log and diffs each
        # flow's taps/seconds against PhaseTrainingUITests/tap-budget-baseline.json,
        # writing a table to the run's step summary. Gates ONLY on
        # harness-broken signals (a tracked flow that stopped emitting, or a
        # corrupt baseline); actual-vs-baseline drift stays visibility-only,
        # honoring the track-don't-gate decision.
        if: always() && matrix.shard == 'taps'
        run: python3 scripts/quality/tap_budget_diff.py build/raw-test.log

      - name: Upload tap-budget history
        # The drift step appends one line per flow to build/tap-budget-history.jsonl
        # (date, sha, flow, actual, seconds). Uploading it as an artifact keeps
        # the trend line alive across runners — download and re-append locally,
        # or chain via a persist-to-branch action, to build a long-run view.
        if: always() && matrix.shard == 'taps'
        uses: actions/upload-artifact@v4
        with:
          name: tap-budget-history
          path: build/tap-budget-history.jsonl
          if-no-files-found: ignore

      - name: Upload xcresult on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ matrix.shard }}.xcresult
          path: build/TestResults.xcresult

      - name: Upload taps xcresult on success
        # A green taps run still holds the Freestyle picker case's activity
        # log, which shows whether the event-loop idle timeout recurred on a
        # slow pass (11e 1.16). About 145 MB a run, so it keeps 7 days.
        if: success() && matrix.shard == 'taps'
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ matrix.shard }}.xcresult
          path: build/TestResults.xcresult
          retention-days: 7

      - name: Upload crash re-run xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RetryResults-${{ matrix.shard }}.xcresult
          path: build/RetryResults.xcresult
          if-no-files-found: ignore
