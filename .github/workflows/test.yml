name: test

# Two jobs (split 2026-09-26):
#   test     build + unit tests (PhaseTrainingTests). Every push to main or an
#            agent branch, every PR, manual runs. About 10 minutes. This is the
#            only compiler agent sessions have, so it runs on every code push.
#   ui-tests the XCUITest suite plus the tap-budget report. PRs, pushes to
#            main, nightly, and manual runs with ui=true. About 30+ minutes,
#            which is why it no longer gates every push.
# Docs-only pushes skip both (paths-ignore). A newer push to the same ref
# cancels the older run.

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['**.md', 'docs/**', 'audits/**', 'handoff/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'audits/**', 'handoff/**']
  schedule:
    # Nightly UI pass at 09:17 UTC (about 3am Mountain), so a UI regression
    # that slipped past branch pushes surfaces within a day.
    - cron: '17 9 * * *'
  # Manual runs so a feature branch can be validated without opening a PR
  # (e.g. agent sessions that can't build locally). ui=true adds the UI suite.
  workflow_dispatch:
    inputs:
      ui:
        description: Also run the UI test suite
        type: boolean
        default: false

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macos-26 ships Xcode 17 with iOS 26 SDK, matching the dev environment.
    # macos-15 / Xcode 16 / iOS 18 caused divergent SwiftUI accessibility
    # behavior in UI tests — rest-card preset Menu items rendered differently
    # between iOS 18 and iOS 26, making LogFlowTests unfixable on both.
    runs-on: macos-26
    # The nightly schedule is for the UI suite only.
    if: github.event_name != 'schedule'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        id: setup
        uses: ./.github/actions/ios-setup

      - name: Build and run unit tests
        # No retries here: the retry flags exist for the XCUITest cold-boot
        # tap flake, and a unit test that needs a retry is a real bug.
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project PhaseTraining.xcodeproj \
            -scheme PhaseTraining \
            -destination "platform=iOS Simulator,id=${{ steps.setup.outputs.udid }}" \
            -only-testing:PhaseTrainingTests \
            -resultBundlePath build/UnitTestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/raw-unit-test.log \
            | xcbeautify --renderer github-actions

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UnitTestResults.xcresult
          path: build/UnitTestResults.xcresult

  ui-tests:
    runs-on: macos-26
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.ui)
    # 45, not 20: every run since #307 (2026-08-27) was killed at exactly
    # the 20-minute mark mid-UI-suite — the suite has outgrown the old
    # budget on these runners, so CI could never reach a verdict.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        id: setup
        uses: ./.github/actions/ios-setup

      - name: Run UI tests
        # -retry-tests-on-failure + -test-iterations 3: retry only the
        # individual failing test cases (not the whole suite), up to 2
        # retries each. Absorbs the macos-26 cold-boot XCUITest rig flake
        # we've been chasing — synthesized taps occasionally fail to
        # register on a freshly-booted simulator, hitting a different test
        # each run. A real regression still fails (it'd fail all 3 tries);
        # a single-shot rig flake gets absorbed transparently. Apple-
        # supported since Xcode 13.
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project PhaseTraining.xcodeproj \
            -scheme PhaseTraining \
            -destination "platform=iOS Simulator,id=${{ steps.setup.outputs.udid }}" \
            -only-testing:PhaseTrainingUITests \
            -resultBundlePath build/TestResults.xcresult \
            -retry-tests-on-failure \
            -test-iterations 3 \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/raw-test.log \
            | xcbeautify --renderer github-actions

      - name: Tap budget diff tests
        # The diff script's own unit tests (gating contract, retry semantics,
        # baseline parsing). Cheap; run before the drift step so a broken
        # script can't mislead the report.
        run: python3 scripts/quality/test_tap_budget_diff.py

      - name: Tap budget drift
        # Parses the TAP-BUDGET-JSON markers from the test log and diffs each
        # flow's taps/seconds against PhaseTrainingUITests/tap-budget-baseline.json,
        # writing a table to the run's step summary. Gates ONLY on
        # harness-broken signals (a tracked flow that stopped emitting, or a
        # corrupt baseline); actual-vs-baseline drift stays visibility-only,
        # honoring the track-don't-gate decision.
        if: always()
        run: python3 scripts/quality/tap_budget_diff.py build/raw-test.log

      - name: Upload tap-budget history
        # The drift step appends one line per flow to build/tap-budget-history.jsonl
        # (date, sha, flow, actual, seconds). Uploading it as an artifact keeps
        # the trend line alive across runners — download and re-append locally,
        # or chain via a persist-to-branch action, to build a long-run view.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tap-budget-history
          path: build/tap-budget-history.jsonl
          if-no-files-found: ignore

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: build/TestResults.xcresult
