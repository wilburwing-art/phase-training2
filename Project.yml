name: PhaseTraining

options:
  bundleIdPrefix: art.wilburwing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  schemePathPrefix: ""

schemes:
  PhaseTraining:
    build:
      targets:
        PhaseTraining: all
        PhaseTrainingTests: [test]
        PhaseTrainingUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # Serialize test execution. Parallel test runners showed intermittent
      # "0 results from CoachDatabase" failures (the SQLite open path sometimes
      # left an indeterminate handle even with retries). The DB is tiny and
      # tests run in under a second when serial, so we lose nothing by
      # disabling parallelism.
      parallelizable: false
      targets:
        - name: PhaseTrainingTests
          parallelizable: false
        - name: PhaseTrainingUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

settings:
  base:
    DEVELOPMENT_TEAM: A2Z2RXR65P
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "100"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  # SwiftUI SDK for human-body muscle highlighting. MIT-licensed, zero-dep,
  # iOS 17+. Used by Components/BodyAnatomyView.swift as the rendering engine
  # behind our slug-keyed wrapper.
  MuscleMap:
    url: https://github.com/melihcolpan/MuscleMap.git
    exactVersion: 1.6.4

targets:
  PhaseTraining:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    preBuildScripts:
      - script: "\"$SRCROOT/scripts/generate-coach-secrets.sh\""
        name: Generate CoachSecrets.swift
        inputFiles:
          - "$SRCROOT/scripts/generate-coach-secrets.sh"
        outputFiles:
          - "$SRCROOT/PhaseTraining/Generated/CoachSecrets.swift"
        basedOnDependencyAnalysis: false
    sources:
      - path: PhaseTraining
      # Generated by scripts/generate-coach-secrets.sh as a pre-build phase.
      # Marked optional so xcodegen includes it even on a fresh checkout
      # where Generated/ doesn't yet exist.
      - path: PhaseTraining/Generated/CoachSecrets.swift
        optional: true
    dependencies:
      - package: MuscleMap
    info:
      path: PhaseTraining/Info.plist
      properties:
        CFBundleDisplayName: Phase Training
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-SemiBold.ttf
          - Inter-Regular.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        # AI Coach (Phase 13) — third-party AI prompts disclosed per Apple
        # Guideline 5.1.2(i). Privacy nutrition labels should mirror this.
        NSPrivacyCollectedDataTypes:
          - NSPrivacyCollectedDataType: NSPrivacyCollectedDataTypeOtherUserContent
            NSPrivacyCollectedDataTypeLinked: false
            NSPrivacyCollectedDataTypeTracking: false
            NSPrivacyCollectedDataTypePurposes:
              - NSPrivacyCollectedDataTypePurposeAppFunctionality
        CFBundleURLTypes:
          - CFBundleURLName: com.phasetraining.app
            CFBundleURLSchemes:
              - phasetraining
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phasetraining.app
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

  PhaseTrainingTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PhaseTrainingTests
    dependencies:
      - target: PhaseTraining
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phasetraining.app.tests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PhaseTraining.app/PhaseTraining
        GENERATE_INFOPLIST_FILE: YES

  PhaseTrainingUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PhaseTrainingUITests
    dependencies:
      - target: PhaseTraining
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phasetraining.app.uitests
        TEST_TARGET_NAME: PhaseTraining
        GENERATE_INFOPLIST_FILE: YES
