<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" width="260" height="300" role="img" aria-label="The Repelican, 100 percent bulk">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F5F0"/><stop offset="1" stop-color="#C7C7BD"/>
    </linearGradient>
  </defs>
  <g stroke="#D4FF3D" stroke-width="3" stroke-linecap="round" opacity=".9">
        <line x1="30" y1="126" x2="20" y2="126"/>
        <line x1="32" y1="140" x2="18" y2="140"/></g><g stroke="#D4FF3D" stroke-width="3" stroke-linecap="round" opacity=".9">
        <line x1="230" y1="126" x2="240" y2="126"/>
        <line x1="228" y1="140" x2="242" y2="140"/></g>
  <!-- feet -->
  <g fill="#FF6B4A">
    <path d="M 106 262 q -16 6 -18 20 q 18 6 30 -2 q 4 -10 -12 -18 z"/>
    <path d="M 154 262 q 16 6 18 20 q -18 6 -30 -2 q -4 -10 12 -18 z"/>
    <rect x="106" y="248" width="9" height="20" rx="4" fill="#E24A2C"/>
    <rect x="145" y="248" width="9" height="20" rx="4" fill="#E24A2C"/>
  </g>
  <!-- torso -->
  <ellipse cx="130" cy="206" rx="54" ry="66" fill="url(#body)" stroke="#C7C7BD" stroke-width="2"/>
  <path d="M 130 168 q 0 42 0 60" stroke="#C7C7BD" stroke-width="2" fill="none" opacity=".55"/>
  <path d="M 103 176 q 27 20 0 36" stroke="#C7C7BD" stroke-width="2" fill="none" opacity=".4"/>
  <path d="M 157 176 q -27 20 0 36" stroke="#C7C7BD" stroke-width="2" fill="none" opacity=".4"/>
  <!-- arms -->
  <line x1="96.52000000000001" y1="170" x2="38" y2="158" stroke="#DEDED6" stroke-width="32" stroke-linecap="round"/><line x1="163.48" y1="170" x2="222" y2="158" stroke="#DEDED6" stroke-width="32" stroke-linecap="round"/>
  <line x1="38" y1="158" x2="100" y2="78" stroke="#DEDED6" stroke-width="32" stroke-linecap="round"/><line x1="222" y1="158" x2="160" y2="78" stroke="#DEDED6" stroke-width="32" stroke-linecap="round"/>
  <circle cx="42.8" cy="154.8" r="25" fill="#F5F5F0"/>
  <circle cx="217.2" cy="154.8" r="25" fill="#F5F5F0"/>
  <path d="M 25.5 143 q 12.5 -10 25 5" stroke="#C7C7BD" stroke-width="2" fill="none" opacity=".5"/>
  <path d="M 234.5 143 q -12.5 -10 -25 5" stroke="#C7C7BD" stroke-width="2" fill="none" opacity=".5"/>
  <circle cx="100" cy="78" r="18" fill="#DEDED6"/>
  <circle cx="160" cy="78" r="18" fill="#DEDED6"/>
  <circle cx="78.3" cy="106" r="17" fill="none" stroke="#D4FF3D" stroke-width="6" stroke-linecap="round"/><circle cx="181.7" cy="106" r="17" fill="none" stroke="#D4FF3D" stroke-width="6" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="130" cy="90" r="34" fill="url(#body)" stroke="#C7C7BD" stroke-width="2"/>
  <path d="M 98 78 a 34 34 0 0 1 64 0 l 0 9 a 34 34 0 0 0 -64 0 z" fill="#D4FF3D"/>
  <rect x="98" y="84" width="64" height="4" fill="#8FA82A" opacity=".6"/>
  <path d="M 158 86 q 20 2 30 16 q -14 -2 -20 2 q 2 -10 -10 -18 z" fill="#D4FF3D"/>
  <!-- eyes -->
  <circle cx="118" cy="93" r="7" fill="#fff"/><circle cx="142" cy="93" r="7" fill="#fff"/>
  <circle cx="120" cy="94" r="3.4" fill="#14161A"/><circle cx="144" cy="94" r="3.4" fill="#14161A"/>
  <circle cx="119" cy="92.4" r="1.2" fill="#D4FF3D"/><circle cx="143" cy="92.4" r="1.2" fill="#D4FF3D"/>
  <!-- bill + pouch -->
  <path d="M 116 102 q 14 6 28 0 q 6 20 -2 36 q -12 10 -24 0 q -8 -16 -2 -36 z" fill="#FF6B4A" stroke="#E24A2C" stroke-width="2"/>
  <path d="M 121 112 q 9 6 18 0 q 2 12 -3 22 q -6 6 -12 0 q -5 -10 -3 -22 z" fill="#FF8A6E"/>
  <circle cx="130" cy="148" r="3" fill="#E24A2C"/>
