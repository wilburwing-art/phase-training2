<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PhaseTraining · Vertical Slice</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  html, body { margin: 0; background: #0A0B0D; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 24px 40px;
    box-sizing: border-box;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="hd-style.jsx"></script>
<script type="text/babel" src="hd-training-log.jsx"></script>
<script type="text/babel" src="hd-session-start.jsx"></script>
<script type="text/babel" src="hd-session-complete.jsx"></script>
<script type="text/babel" src="hd-history.jsx"></script>

<script type="text/babel" data-presets="react">

const SCREENS = [
  { id: 'start',    label: '1 · Start',    sub: 'Pick workout' },
  { id: 'log',      label: '2 · Log',      sub: 'In session' },
  { id: 'complete', label: '3 · Complete',  sub: 'Save & close' },
  { id: 'history',  label: '4 · History',   sub: 'Previous data' },
];

function FlowNav({ active, onChange }) {
  return (
    <div style={{ display: 'flex', gap: 4, marginBottom: 20, flexWrap: 'wrap',
                   justifyContent: 'center' }}>
      {SCREENS.map((s, i) => {
        const on = s.id === active;
        return (
          <React.Fragment key={s.id}>
            <button onClick={() => onChange(s.id)} style={{
              padding: '8px 16px', borderRadius: 10, border: 'none', cursor: 'pointer',
              background: on ? '#D4FF3D' : '#14161A',
              color: on ? '#0A0B0D' : '#7A7D85',
              fontFamily: 'Inter', fontSize: 13, fontWeight: on ? 700 : 500,
              letterSpacing: '-0.01em',
              transition: 'all 0.15s',
            }}>
              {s.label}
            </button>
            {i < SCREENS.length - 1 && (
              <div style={{ display: 'flex', alignItems: 'center', color: '#2A2E35' }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <polyline points="9 18 15 12 9 6"/>
                </svg>
              </div>
            )}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function FlowLabel({ screen }) {
  const s = SCREENS.find(x => x.id === screen);
  return (
    <div style={{ textAlign: 'center', marginBottom: 16 }}>
      <div style={{ fontFamily: 'JetBrains Mono', fontSize: 10, letterSpacing: '0.14em',
                     textTransform: 'uppercase', color: '#7A7D85', fontWeight: 500 }}>
        {s.sub}
      </div>
    </div>
  );
}

function App() {
  const [screen, setScreen] = React.useState('start');

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
      {/* title */}
      <div style={{ textAlign: 'center', marginBottom: 20 }}>
        <div style={{ fontFamily: 'Space Grotesk', fontSize: 18, fontWeight: 600,
                       color: '#F5F5F0', letterSpacing: '-0.02em' }}>
          Thin Vertical Slice
        </div>
        <div style={{ fontFamily: 'JetBrains Mono', fontSize: 11, color: '#7A7D85',
                       marginTop: 4, letterSpacing: '0.04em' }}>
          THE DAILY LOOP · 4 SCREENS
        </div>
      </div>

      <FlowNav active={screen} onChange={setScreen}/>
      <FlowLabel screen={screen}/>

      {/* phone frame */}
      <div style={{ position: 'relative' }}>
        {screen === 'start' && <HDSessionStart/>}
        {screen === 'log' && <HDTrainingLog/>}
        {screen === 'complete' && <HDSessionComplete/>}
        {screen === 'history' && <HDHistory/>}
      </div>

      {/* flow description */}
      <div style={{ maxWidth: 402, marginTop: 20, padding: '14px 16px', borderRadius: 12,
                     background: '#14161A', border: '0.5px solid #2A2E35' }}>
        <div style={{ fontFamily: 'JetBrains Mono', fontSize: 10, letterSpacing: '0.12em',
                       textTransform: 'uppercase', color: '#7A7D85', fontWeight: 500,
                       marginBottom: 8 }}>
          THE LOOP
        </div>
        <div style={{ fontFamily: 'Inter', fontSize: 13, color: '#B5B7BD', lineHeight: 1.6 }}>
          <span style={{ color: screen === 'start' ? '#D4FF3D' : '#B5B7BD', fontWeight: screen === 'start' ? 600 : 400 }}>
            Pick workout</span>
          {' → '}
          <span style={{ color: screen === 'log' ? '#D4FF3D' : '#B5B7BD', fontWeight: screen === 'log' ? 600 : 400 }}>
            Log sets</span>
          {' → '}
          <span style={{ color: screen === 'complete' ? '#D4FF3D' : '#B5B7BD', fontWeight: screen === 'complete' ? 600 : 400 }}>
            Save</span>
          {' → '}
          <span style={{ color: '#7A7D85' }}>next week</span>
          {' → '}
          <span style={{ color: screen === 'history' ? '#D4FF3D' : '#B5B7BD', fontWeight: screen === 'history' ? 600 : 400 }}>
            See previous</span>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
