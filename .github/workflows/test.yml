name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macos-26 ships Xcode 17 with iOS 26 SDK, matching the dev environment.
    # macos-15 / Xcode 16 / iOS 18 caused divergent SwiftUI accessibility
    # behavior in UI tests — rest-card preset Menu items rendered differently
    # between iOS 18 and iOS 26, making LogFlowTests unfixable on both.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen + xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate CoachSecrets.swift (empty token — tests don't hit the gateway)
        run: ./scripts/generate-coach-secrets.sh

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | .value[] | select(.name | test("iPhone")) | .udid] | first')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No iPhone simulator available. Listing all devices:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run tests
        # -retry-tests-on-failure + -test-iterations 3: retry only the
        # individual failing test cases (not the whole suite), up to 2
        # retries each. Absorbs the macos-26 cold-boot XCUITest rig flake
        # we've been chasing — synthesized taps occasionally fail to
        # register on a freshly-booted simulator, hitting a different test
        # each run. A real regression still fails (it'd fail all 3 tries);
        # a single-shot rig flake gets absorbed transparently. Apple-
        # supported since Xcode 13.
        run: |
          set -o pipefail
          xcodebuild test \
            -project PhaseTraining.xcodeproj \
            -scheme PhaseTraining \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/TestResults.xcresult \
            -retry-tests-on-failure \
            -test-iterations 3 \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: build/TestResults.xcresult
