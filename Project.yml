name: PhaseTraining

options:
  bundleIdPrefix: art.wilburwing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  schemePathPrefix: ""

schemes:
  PhaseTraining:
    build:
      targets:
        PhaseTraining: all
        PhaseTrainingTests: [test]
        PhaseTrainingUITests: [test]
    run:
      config: Debug
      # Local previews / debug runs resolve the Pro product from this config
      # instead of an empty App Store Connect response (real product IDs are
      # still placeholders — see SubscriptionStore.swift).
      storeKitConfiguration: PhaseTraining.storekit
    test:
      config: Debug
      # Serialize test execution. Parallel test runners showed intermittent
      # "0 results from CoachDatabase" failures (the SQLite open path sometimes
      # left an indeterminate handle even with retries). The DB is tiny and
      # tests run in under a second when serial, so we lose nothing by
      # disabling parallelism.
      parallelizable: false
      targets:
        - name: PhaseTrainingTests
          parallelizable: false
        - name: PhaseTrainingUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

settings:
  base:
    DEVELOPMENT_TEAM: A2Z2RXR65P
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "145"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  # SwiftUI SDK for human-body muscle highlighting. MIT-licensed, zero-dep,
  # iOS 17+. Used by Components/BodyAnatomyView.swift as the rendering engine
  # behind our slug-keyed wrapper.
  MuscleMap:
    url: https://github.com/melihcolpan/MuscleMap.git
    exactVersion: 1.6.4

targets:
  PhaseTraining:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    preBuildScripts:
      - script: "\"$SRCROOT/scripts/generate-coach-secrets.sh\""
        name: Generate CoachSecrets.swift
        inputFiles:
          - "$SRCROOT/scripts/generate-coach-secrets.sh"
        outputFiles:
          - "$SRCROOT/PhaseTraining/Generated/CoachSecrets.swift"
        basedOnDependencyAnalysis: false
    sources:
      - path: PhaseTraining
        # ExerciseImages/ is a folder reference (one PBXFileReference, copied
        # whole to the bundle) so xcodegen doesn't enumerate 525 per-file
        # entries. The Swift side reads them by id via Bundle.main.url.
        excludes:
          - "Resources/ExerciseImages/**"
      # Phone-and-watch code (PLAN-watch.md). Foundation only. The watch
      # target picks this up once the session models it needs move here.
      - path: Shared
      - path: PhaseTraining/Resources/ExerciseImages
        type: folder
      # Generated by scripts/generate-coach-secrets.sh as a pre-build phase.
      # Marked optional so xcodegen includes it even on a fresh checkout
      # where Generated/ doesn't yet exist.
      - path: PhaseTraining/Generated/CoachSecrets.swift
        optional: true
    dependencies:
      - package: MuscleMap
      # The watch companion (PLAN-watch.md). xcodegen embeds a watchOS app
      # dependency into the iOS bundle's Watch/ directory.
      - target: PhaseTrainingWatch
    info:
      path: PhaseTraining/Info.plist
      properties:
        CFBundleDisplayName: Phase Training
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-SemiBold.ttf
          - Inter-Regular.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        # Phase 2 HealthKit read capability. Reviewer-facing string —
        # Apple App Review rejects generic copy here, so name the actual
        # behavior (read workouts → drive readiness signal → match
        # generated workout difficulty to real activity).
        NSHealthShareUsageDescription: "PhaseTraining reads recent workout history to gauge your current training readiness, match generated workouts to how active you've actually been, and offer to log outdoor sessions it finds (like a ski day or a climb) so your training week can adjust. With your separate permission, it can also import body weight, body-fat %, and lean-mass readings to populate your training log. Only if you tap Capture recovery data, it also reads nightly heart rate variability, resting heart rate and sleep and keeps a nightly summary on your device, to learn how recovery relates to your training. That recovery data never leaves your device."
        # Required by App Store validation whenever the HealthKit entitlement is
        # present, EVEN THOUGH this app is read-only (requestAuthorization passes
        # toShare: []). Without this key, altool rejects the upload with a 409
        # "Missing purpose string" (killed builds 116 + 117). The string is
        # honest: we never write.
        NSCalendarsFullAccessUsageDescription: "Only when you tap Find travel in the weekly check-in, PhaseTraining reads next week's calendar events on your device to spot trips (hotel stays, flights, multi-day trips away) and mark those days as travel days. Event titles and locations are not stored and never leave your device."
        # 3c capture (build 145). One coarse fix at session start only,
        # asked at the first session start; see SessionLocationCapture.swift.
        NSLocationWhenInUseUsageDescription: "When you start a workout, PhaseTraining takes one approximate location (to about 100 meters) so it can learn the places you train, like your gym or the crag, and later offer the right version of a session there. It never tracks you in the background or while you train, and the location stays on your device."
        NSHealthUpdateUsageDescription: "PhaseTraining saves each workout you finish to Apple Health as a strength-training workout (start, end and, from Apple Watch, heart rate), so it counts toward your rings and shows in the Fitness app. Each session is saved once. PhaseTraining never edits or deletes anything else in Health."
        # Log-screen media card (build 133). MPMediaLibrary authorisation is
        # what lets MPMusicPlayerController.systemMusicPlayer report the
        # now-playing item; without this key the request cannot be made.
        # Same reviewer-facing voice as the Health strings: name the
        # behaviour, and say what is NOT done.
        NSAppleMusicUsageDescription: "PhaseTraining shows the track Apple Music is playing while you log a workout, with pause and skip, so you can change songs without leaving the app. It never reads or changes your library and never starts music on its own."
        # NSPrivacyCollectedDataTypes used to live here. Apple reads the
        # privacy manifest from PhaseTraining/PrivacyInfo.xcprivacy, not from
        # Info.plist, so declaring it here meant the app shipped without one.
        # See that file for the collected types + the UserDefaults
        # required-reason declaration.
        CFBundleURLTypes:
          - CFBundleURLName: com.phasetraining.app
            CFBundleURLSchemes:
              - phasetraining
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phasetraining.app
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Phase 2 HealthKit read capability. Read-only on HKWorkoutType —
        # no clinical-record access, no HK write. Usage description is in
        # PhaseTraining/Info.plist as NSHealthShareUsageDescription.
        CODE_SIGN_ENTITLEMENTS: PhaseTraining/PhaseTraining.entitlements
        # Localization: emit per-compile .stringsdata so the String Catalog
        # (PhaseTraining/Resources/Localizable.xcstrings) extracts every
        # Text("…")/Button/Label literal, and route -export/-importLocalizations
        # through the catalog instead of legacy .strings. App target only.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "PhaseTraining App Store"
          DEVELOPMENT_TEAM: A2Z2RXR65P

  # Watch companion, build 146 (PLAN-watch.md). A single-target watchOS app
  # (no separate extension) embedded in the iOS app. Release signing for it
  # (its own App ID and App Store profile) lands in the plan's step 4; until
  # then only Debug simulator builds of this target are expected to succeed.
  PhaseTrainingWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: PhaseTrainingWatch
      - path: Shared
    info:
      path: PhaseTrainingWatch/Info.plist
      properties:
        CFBundleDisplayName: Phase Training
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.phasetraining.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phasetraining.app.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES

  PhaseTrainingTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PhaseTrainingTests
    dependencies:
      - target: PhaseTraining
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phasetraining.app.tests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PhaseTraining.app/PhaseTraining
        GENERATE_INFOPLIST_FILE: YES

  PhaseTrainingUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PhaseTrainingUITests
    dependencies:
      - target: PhaseTraining
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phasetraining.app.uitests
        TEST_TARGET_NAME: PhaseTraining
        GENERATE_INFOPLIST_FILE: YES
