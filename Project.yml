name: PhaseTraining

options:
  bundleIdPrefix: art.wilburwing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  schemePathPrefix: ""

schemes:
  PhaseTraining:
    build:
      targets:
        PhaseTraining: all
        PhaseTrainingTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PhaseTrainingTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

settings:
  base:
    DEVELOPMENT_TEAM: A2Z2RXR65P
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "14"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  PhaseTraining:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PhaseTraining
    info:
      path: PhaseTraining/Info.plist
      properties:
        CFBundleDisplayName: Phase Training
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-SemiBold.ttf
          - Inter-Regular.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phasetraining.app
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

  PhaseTrainingTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PhaseTrainingTests
    dependencies:
      - target: PhaseTraining
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phasetraining.app.tests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PhaseTraining.app/PhaseTraining
        GENERATE_INFOPLIST_FILE: YES
